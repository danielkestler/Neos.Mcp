Neos:
  Mcp:
    # The MCP servers, by name. Each one offers the operations of neos/openapi APIs as tools, over the Streamable HTTP
    # transport of MCP 2026-07-28 (stateless). A server is removed by setting it to ~
    servers:
      # The Neos API (Neos.Api) at /mcp
      neos:
        # the endpoint, relative to the base URI
        uriPrefix: 'mcp'
        # optional: defaults to the server's key
        name: 'Neos'
        version: '1.0.0'
        # optional: for the model, sent with the server's description
        instructions: |
          Neos is a content management system. Content lives in content repositories (usually "default") as nodes:
          documents (pages) with content below them, in workspaces and dimension space points (e.g. languages).

          Reading
          - Start with listSites, then listNodes or getNode. getNodeType tells a node type's properties.
          - workspaceName defaults to "live" (the published website). dimensionSpacePoint is a JSON string such as
            {"language":"en_US"} and defaults to the site's default.
          - Use include (e.g. "children,references") instead of one call per node.
          - Page with offset and limit. Don't follow the URLs in links: they belong to the REST API, not to this server.

          Changing content
          - Never change "live" directly. Work in the user's personal workspace (listWorkspaces shows it; create it with
            createWorkspace if there is none) or a shared one they name.
          - Show what changed with listWorkspaceChanges. Call publishWorkspace only when the user asks to publish.
          - A node with isShineThrough shows another language's content: create a variant with createNodeVariant first.

          Ask before calling discardWorkspace, deleteNode, deleteSite, deleteUser, deleteWorkspace or flushCaches.

          Errors are problem documents. 404 also means you may not see something, 403 that the account lacks the
          right, 422 and 409 explain what to fix in their detail.
        # names from Neos.OpenApi.FlowAdapter.apis
        apis:
          'neos': true
        # optional: by OpenAPI tag, include empty for all
        tags:
          include: []
          exclude: []
        # PSR-15 middlewares around each operation call, e.g. to turn exceptions into problem responses, by key
        operationMiddlewares:
          'Neos.Api:oauthChallenge': 'Neos\Api\Infrastructure\Http\OAuthChallengeMiddleware'
        # The key of the server in Neos.OAuth.protectedResources (below): requests need an access token for it, and
        # get a 401 pointing to its metadata otherwise
        protectedResource: 'Neos.Mcp:Neos'
        # Hosts the Origin header (or, without one, the Host header) may name, against DNS rebinding. The issuer's
        # host is always allowed
        allowedHosts: ['localhost', '127.0.0.1', '[::1]']

  OAuth:
    protectedResources:
      # The neos server above. Its path is the server's uriPrefix, and it only accepts tokens bound to it (RFC 8707)
      'Neos.Mcp:Neos':
        path: 'mcp'
        name: 'Neos MCP server'
        scopeProvider: 'Neos\Api\Security\PrivilegeScopes'
        requireAudience: true

  Flow:
    mvc:
      routes:
        'Neos.Mcp':
          # ahead of catch-all routes such as the Neos frontend's
          position: start
          providerFactory: Neos\Mcp\Routing\McpRoutesProviderFactory
    security:
      authentication:
        providers:
          'Neos.OAuth:Bearer':
            requestPatterns:
              # every server's endpoint
              'Neos.Mcp:Neos':
                pattern: 'Uri'
                patternOptions:
                  uriPattern: '/mcp'
